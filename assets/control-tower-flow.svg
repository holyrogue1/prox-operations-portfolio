<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc"><title id="title">공공조달 컨트롤타워 설계</title><desc id="desc">모두모아의 인원·교육·일정과 에이몬스의 조달·재고·SCM을 데이터 검증, API, AI 분석, 담당자 검토로 연결하는 확장 설계</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122538"/><stop offset="1" stop-color="#102e40"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8cc9ff"/></marker></defs><rect x="1" y="1" width="798" height="638" rx="12" fill="url(#bg)" stroke="#30485e"/><g fill="none" stroke="#8cc9ff" stroke-width="2" marker-end="url(#arrow)"><path d="M230 210v45h340v-45" marker-end="none"/><path d="M400 255v47"/><path d="M400 388v55"/><path d="M230 515h-96V165h60" stroke-dasharray="6 7"/></g><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif"><text x="48" y="60" fill="#8cc9ff" font-size="16" letter-spacing="3">CONTROL TOWER / 설계 방향</text><g fill="#0b1726" stroke="#527089"><rect x="48" y="104" width="300" height="106" rx="6"/><rect x="452" y="104" width="300" height="106" rx="6"/><rect x="230" y="302" width="340" height="86" rx="6"/><rect x="230" y="443" width="340" height="128" rx="6"/></g><g fill="#eef5fa" font-size="27" font-weight="700" text-anchor="middle"><text x="198" y="148">모두모아</text><text x="602" y="148">에이몬스</text><text x="400" y="340">데이터 검증 · API</text><text x="400" y="483">AI 분석 · 담당자 검토</text></g><g fill="#b5c6d7" font-size="18" text-anchor="middle"><text x="198" y="183">인원 · 교육 · 일정</text><text x="602" y="183">조달 · 재고 · SCM</text><text x="400" y="370">입력 · 기준정보 · 처리 상태</text><text x="400" y="518">위험 확인 → 대응 판단</text><text x="400" y="549">피드백 → 재검증</text></g><text x="48" y="610" fill="#81dbb1" font-size="15">실제 화면에서 검증하고 다음 설계로 되돌리는 반복 구조</text></g></svg>
